<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Güneş Sistemi - Müzikli</title>
<style>
body {
  margin: 0;
  background: radial-gradient(ellipse at bottom, #0d1a26 0%, #000 100%);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
  font-family: Arial, sans-serif;
}
.container {
  display: flex;
  gap: 40px;
}
.system {
  position: relative;
  width: 800px;
  height: 800px;
}
.orbit {
  position: absolute;
  border: 1px dashed rgba(255,255,255,0.2);
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.planet {
  position: absolute;
  top: 50%;
  left: 50%;
  transform-origin: -50% 0;
  cursor: pointer;
  animation: orbit linear infinite;
}
.planet img {
  display: block;
  border-radius: 50%;
  box-shadow: 0 0 15px rgba(255,255,255,0.4);
}
@keyframes orbit {
  from { transform: rotate(0deg) translateX(var(--dist)); }
  to   { transform: rotate(360deg) translateX(var(--dist)); }
}
.sun {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: url("https://upload.wikimedia.org/wikipedia/commons/4/4e/Sun_white.jpg") no-repeat center/cover;
  box-shadow: 0 0 80px 40px rgba(255,200,50,0.8);
}
.sidebar {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 15px;
  font-size: 20px;
  background: rgba(0,0,0,0.3);
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 20px rgba(255,255,255,0.2);
}
.planet-name {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: transform 0.2s, color 0.3s, box-shadow 0.3s;
  padding: 8px;
  border-radius: 5px;
}
.planet-name:hover {
  color: gold;
  transform: scale(1.05);
  box-shadow: 0 0 10px gold;
}
.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: inline-block;
  box-shadow: 0 0 5px rgba(255,255,255,0.4);
}
</style>
</head>
<body>

<div class="container">
  <div class="system">
    <div class="sun"></div>

    <div class="orbit" style="width:160px;height:160px;"></div>
    <div class="planet" data-sound="mercury" style="--dist:80px; animation-duration:12s;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Mercury_in_true_color.jpg" width="22">
    </div>

    <div class="orbit" style="width:220px;height:220px;"></div>
    <div class="planet" data-sound="venus" style="--dist:110px; animation-duration:18s;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/Venus-real_color.jpg" width="30">
    </div>

    <div class="orbit" style="width:300px;height:300px;"></div>
    <div class="planet" data-sound="earth" style="--dist:150px; animation-duration:25s;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg" width="35">
    </div>

    <div class="orbit" style="width:380px;height:380px;"></div>
    <div class="planet" data-sound="mars" style="--dist:190px; animation-duration:30s;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg" width="28">
    </div>

    <div class="orbit" style="width:480px;height:480px;"></div>
    <div class="planet" data-sound="jupiter" style="--dist:240px; animation-duration:40s;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.jpg" width="60">
    </div>

    <div class="orbit" style="width:600px;height:600px;"></div>
    <div class="planet" data-sound="saturn" style="--dist:300px; animation-duration:50s;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Saturn_during_Equinox.jpg" width="55">
    </div>
  </div>

  <div class="sidebar">
    <div class="planet-name" data-sound="mercury"><span class="dot" style="background:#aaa;"></span> Merkür</div>
    <div class="planet-name" data-sound="venus"><span class="dot" style="background:#f5e4b7;"></span> Venüs</div>
    <div class="planet-name" data-sound="earth"><span class="dot" style="background:#4a90e2;"></span> Dünya</div>
    <div class="planet-name" data-sound="mars"><span class="dot" style="background:#c1440e;"></span> Mars</div>
    <div class="planet-name" data-sound="jupiter"><span class="dot" style="background:#d9b382;"></span> Jüpiter</div>
    <div class="planet-name" data-sound="saturn"><span class="dot" style="background:#f7dfc6;"></span> Satürn</div>
  </div>
</div>

<!-- Ses Dosyaları -->
<audio id="mercuryAudio" src="mercury.mp3"></audio>
<audio id="venusAudio" src="venus.mp3"></audio>
<audio id="earthAudio" src="earth.mp3"></audio>
<audio id="marsAudio" src="mars.mp3"></audio>
<audio id="jupiterAudio" src="jupiter.mp3"></audio>
<audio id="saturnAudio" src="saturn.mp3"></audio>

<script>
let audioMap = {};
function initAudio(){
  document.querySelectorAll("audio").forEach(audio=>{
    audioMap[audio.id.replace("Audio","")] = audio;
  });
}
document.addEventListener("DOMContentLoaded", ()=>{
  initAudio();
  document.querySelectorAll('[data-sound]').forEach(el=>{
    el.addEventListener('click', ()=>{
      let name = el.getAttribute('data-sound');
      let audio = audioMap[name];
      if(audio){
        audio.currentTime = 0;
        audio.play();
      }
    });
  });
});
</script>

</body>
</html>
