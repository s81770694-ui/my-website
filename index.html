<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Gelişmiş Güneş Sistemi</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(ellipse at bottom, #0d1a26 0%, #000 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      gap: 50px;
    }
    .system {
      position: relative;
      width: 800px;
      height: 800px;
    }
    .orbit {
      position: absolute;
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .planet {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: -50% 0;
      cursor: pointer;
      animation: orbit linear infinite;
    }
    .planet img {
      display: block;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255,255,255,0.3);
    }
    @keyframes orbit {
      from { transform: rotate(0deg) translateX(var(--dist)); }
      to   { transform: rotate(360deg) translateX(var(--dist)); }
    }
    .sun {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: url("https://upload.wikimedia.org/wikipedia/commons/4/4e/Sun_white.jpg") no-repeat center/cover;
      box-shadow: 0 0 80px 40px rgba(255,200,50,0.8);
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15px;
      font-size: 20px;
    }
    .planet-name {
      cursor: pointer;
      transition: color 0.2s;
    }
    .planet-name:hover {
      color: gold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="system">
      <div class="sun"></div>

      <div class="orbit" style="width:160px;height:160px;"></div>
      <div class="planet" data-sound="mercury" style="--dist:80px; animation-duration:10s;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Mercury_in_true_color.jpg" width="22">
      </div>

      <div class="orbit" style="width:220px;height:220px;"></div>
      <div class="planet" data-sound="venus" style="--dist:110px; animation-duration:15s;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/Venus-real_color.jpg" width="30">
      </div>

      <div class="orbit" style="width:300px;height:300px;"></div>
      <div class="planet" data-sound="earth" style="--dist:150px; animation-duration:20s;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg" width="35">
      </div>

      <div class="orbit" style="width:380px;height:380px;"></div>
      <div class="planet" data-sound="mars" style="--dist:190px; animation-duration:25s;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg" width="28">
      </div>

      <div class="orbit" style="width:480px;height:480px;"></div>
      <div class="planet" data-sound="jupiter" style="--dist:240px; animation-duration:35s;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.jpg" width="60">
      </div>

      <div class="orbit" style="width:600px;height:600px;"></div>
      <div class="planet" data-sound="saturn" style="--dist:300px; animation-duration:45s;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Saturn_during_Equinox.jpg" width="55">
      </div>
    </div>

    <div class="sidebar">
      <div class="planet-name" data-sound="mercury">Merkür</div>
      <div class="planet-name" data-sound="venus">Venüs</div>
      <div class="planet-name" data-sound="earth">Dünya</div>
      <div class="planet-name" data-sound="mars">Mars</div>
      <div class="planet-name" data-sound="jupiter">Jüpiter</div>
      <div class="planet-name" data-sound="saturn">Satürn</div>
    </div>
  </div>

  <script>
    // Ses motoru
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function playNote(freq){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1);
      osc.stop(ctx.currentTime + 1);
    }

    // Gezegenlere frekanslar ata
    const freqs = {
      mercury: 220,
      venus: 330,
      earth: 440,
      mars: 550,
      jupiter: 660,
      saturn: 770
    };

    // Hem gezegenlere hem isim listesine tıklama olayı
    document.querySelectorAll('[data-sound]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const name = el.getAttribute('data-sound');
        playNote(freqs[name]);
      });
    });
  </script>
</body>
</html>
