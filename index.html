<!DOCTYPE html>
<html>
<head>
    <title>My Space Website</title>
    <style>
        body {
            background: radial-gradient(circle at top, #0b0f3b, #000);
            color: #fff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 50px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 20px;
            color: #ffcc00;
        }

        p {
            font-size: 20px;
            margin-bottom: 40px;
        }

        .planets img {
            margin: 20px;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            transition: transform 0.3s;
        }

        .planets img:hover {
            transform: scale(1.2);
        }

        footer {
            margin-top: 50px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>Welcome to Space!</h1>
    <p>Explore the planets of our solar system.</p>

    <div class="planets">
        <img src="mars.png" alt="Mars">
        <img src="earth.png" alt="Earth">
        <img src="jupiter.png" alt="Jupiter">
    </div>

    <footer>Created with GitHub Pages 🚀</footer>
</body>
</html>
