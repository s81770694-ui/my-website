<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Güneş Sistemi - Etkileşimli</title>
<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
.container {
  display: flex;
  height: 100vh;
}
.system {
  flex: 3;
  position: relative;
  background: radial-gradient(ellipse at center, #000 70%, #010101 100%);
  overflow: hidden;
}
.starfield {
  position: absolute;
  width: 100%;
  height: 100%;
}
.planet {
  position: absolute;
  cursor: pointer;
  transition: transform 0.5s ease;
}
.planet img {
  border-radius: 50%;
  box-shadow: 0 0 15px rgba(255,255,255,0.4);
}
.sidebar {
  flex: 1;
  background: rgba(0,0,0,0.6);
  padding: 20px;
  overflow-y: auto;
}
.planet-name {
  cursor: pointer;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 5px;
  background: rgba(255,255,255,0.1);
  transition: background 0.3s ease, transform 0.3s ease;
}
.planet-name:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.05);
}
.info-box {
  margin-top: 20px;
  padding: 10px;
  background: rgba(0,0,0,0.5);
  border-radius: 5px;
}
</style>
</head>
<body>

<div class="container">
  <div class="system">
    <canvas id="starfield" class="starfield"></canvas>

    <div class="planet" id="mercury" style="top:40%;left:40%;" data-sound="mercury" data-info="Merkür: Güneş'e en yakın gezegen, yüzeyi kraterlerle doludur.">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Mercury_in_true_color.jpg" width="50">
    </div>

    <div class="planet" id="venus" style="top:45%;left:45%;" data-sound="venus" data-info="Venüs: Yoğun atmosferi ve yüzey sıcaklığı ile bilinir.">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/Venus-real_color.jpg" width="60">
    </div>

    <div class="planet" id="earth" style="top:50%;left:50%;" data-sound="earth" data-info="Dünya: Yaşanabilir tek gezegen, su ve canlı yaşamı içerir.">
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg" width="70">
    </div>

    <div class="planet" id="mars" style="top:55%;left:55%;" data-sound="mars" data-info="Mars: Kızıl gezegen, üzerinde su izleri bulunmuştur.">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg" width="60">
    </div>

    <div class="planet" id="jupiter" style="top:60%;left:60%;" data-sound="jupiter" data-info="Jüpiter: Güneş Sistemi'nin en büyük gezegeni, gaz devi.">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.jpg" width="100">
    </div>

    <div class="planet" id="saturn" style="top:65%;left:65%;" data-sound="saturn" data-info="Satürn: Ünlü halkalarıyla tanınır, gaz devi.">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Saturn_during_Equinox.jpg" width="90">
    </div>
  </div>

  <div class="sidebar">
    <div class="planet-name" data-sound="mercury" data-info="Merkür: Güneş'e en yakın gezegen, yüzeyi kraterlerle doludur.">Merkür</div>
    <div class="planet-name" data-sound="venus" data-info="Venüs: Yoğun atmosferi ve yüzey sıcaklığı ile bilinir.">Venüs</div>
    <div class="planet-name" data-sound="earth" data-info="Dünya: Yaşanabilir tek gezegen, su ve canlı yaşamı içerir.">Dünya</div>
    <div class="planet-name" data-sound="mars" data-info="Mars: Kızıl gezegen, üzerinde su izleri bulunmuştur.">Mars</div>
    <div class="planet-name" data-sound="jupiter" data-info="Jüpiter: Güneş Sistemi'nin en büyük gezegeni, gaz devi.">Jüpiter</div>
    <div class="planet-name" data-sound="saturn" data-info="Satürn: Ünlü halkalarıyla tanınır, gaz devi.">Satürn</div>

    <div class="info-box" id="infoBox">Gezegen hakkında bilgi buraya gelecek.</div>
  </div>
</div>

<!-- Ses Dosyaları -->
<audio id="mercuryAudio" src="mercury.mp3"></audio>
<audio id="venusAudio" src="venus.mp3"></audio>
<audio id="earthAudio" src="earth.mp3"></audio>
<audio id="marsAudio" src="mars.mp3"></audio>
<audio id="jupiterAudio" src="jupiter.mp3"></audio>
<audio id="saturnAudio" src="saturn.mp3"></audio>

<script>
let audioMap = {};
function initAudio(){
  document.querySelectorAll("audio").forEach(audio=>{
    audioMap[audio.id.replace("Audio","")] = audio;
  });
}

document.addEventListener("DOMContentLoaded", ()=>{
  initAudio();

  document.querySelectorAll('[data-sound]').forEach(el=>{
    el.addEventListener('click', ()=>{
      let name = el.getAttribute('data-sound');
      let info = el.getAttribute('data-info');

      // Bilgi göster
      document.getElementById("infoBox").innerText = info;

      // Gezegen büyütme efekti
      let planetEl = document.getElementById(name);
      if (planetEl) {
        planetEl.style.transform = "scale(1.5)";
        setTimeout(()=>{planetEl.style.transform = "scale(1)";}, 2000);
      }

      // Ses çalma
      let audio = audioMap[name];
      if(audio){
        audio.currentTime = 0;
        audio.play();
      }
    });
  });

  // Yıldız animasyonu
  const canvas = document.getElementById("starfield");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth * 0.75;
  canvas.height = window.innerHeight;

  const stars = [];
  for(let i=0;i<200;i++){
    stars.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      radius: Math.random()*1.5,
      speed: Math.random()*0.5
    });
  }

  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(star=>{
      ctx.beginPath();
      ctx.arc(star.x,star.y,star.radius,0,Math.PI*2);
      ctx.fillStyle = "white";
      ctx.fill();
      star.x -= star.speed;
      if(star.x<0) star.x=canvas.width;
    });
    requestAnimationFrame(animate);
  }
  animate();
});
</script>

</body>
</html>
