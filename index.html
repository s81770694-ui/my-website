<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Music</title>
  <style>
    body {
      background: black;
      color: yellow;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      font-size: 40px;
    }

    .planets {
      display: flex;
      justify-content: center;
      gap: 30px; /* gezegenler arası boşluk */
      margin-top: 20px;
    }

    .planets img {
      width: 120px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .planets img:hover {
      transform: scale(1.2);
    }

    footer {
      margin-top: 50px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Welcome to Space!</h1>
  <p>Click a planet to hear its music!</p>

  <div class="planets">
    <img src="mars.png" alt="Mars" 
      onclick="document.getElementById('marsAudio').play()">
    <img src="earth.png" alt="Earth" 
      onclick="document.getElementById('earthAudio').play()">
    <img src="jupiter.png" alt="Jupiter" 
      onclick="document.getElementById('jupiterAudio').play()">
  </div>

  <!-- Ses dosyaları -->
  <audio id="marsAudio" src="mars.mp3"></audio>
  <audio id="earthAudio" src="earth.mp3"></audio>
  <audio id="jupiterAudio" src="jupiter.mp3"></audio>

  <footer>Created with GitHub Pages 🚀</footer>
</body>
</html>
